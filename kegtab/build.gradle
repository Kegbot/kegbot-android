apply plugin: 'com.android.application'

android {
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk 17
        targetSdk 35
        multiDexEnabled true

        testApplicationId "org.kegbot.app.test"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }


    buildTypes {
        debug {
            ext.enableCrashlytics = false
        }
        release {
            minifyEnabled true
            debuggable false
            jniDebuggable false
            ext.enableCrashlytics = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/ASL2.0', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE']
        }
    }


    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            resources.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }
    namespace 'org.kegbot.app'
    lint {
        abortOnError false
        checkReleaseBuilds true
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'com.squareup.okhttp:okhttp:2.0.0'
    implementation 'com.squareup:otto:1.3.4'
    implementation 'com.google.guava:guava:33.4.0-android'
    implementation 'com.jakewharton:butterknife:4.0.1'
    annotationProcessor 'com.jakewharton:butterknife:4.0.1'
    implementation 'com.github.kevinsawicki:http-request:5.6'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.7.4'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.protobuf:protobuf-java:3.25.6'
    implementation 'joda-time:joda-time:2.15.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'commons-codec:commons-codec:1.23.0'

    androidTestImplementation 'com.jayway.android.robotium:robotium-solo:5.1'
    androidTestImplementation 'org.mockito:mockito-core:1.9.5'
    androidTestImplementation 'com.google.dexmaker:dexmaker:1.0'
    androidTestImplementation 'com.google.dexmaker:dexmaker-mockito:1.0'
}
